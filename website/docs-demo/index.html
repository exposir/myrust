<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyRust UI demo</title>
<style>
  @font-face {
    font-family: "Geist";
    src: url("fonts/geist.ttf") format("truetype");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Geist Variable";
    src: url("fonts/geist.ttf") format("truetype");
    font-weight: 100 900;
    font-display: swap;
  }
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  /* The frame is what the demo paints: a white page. The browser shows this
     before the wasm runs, so it must already be the demo's own backdrop;
     styling it dark first and repainting it from demo.js flashed a black
     box in every docs preview. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffffff; color: #18181b; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
  body { display: flex; align-items: stretch; padding: 0; box-sizing: border-box; }
  .window { display: flex; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; border: 0; border-radius: 0; background: #ffffff; box-shadow: none; }
  .titlebar { display: none; }
  canvas { display: block; width: 100%; height: 100%; min-height: 0; flex: 1; outline: none; touch-action: none; cursor: default; }
  canvas:focus { box-shadow: inset 0 0 0 2px #22d3ee55; }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar"><div class="lights"><i class="close"></i><i class="min"></i><i class="zoom"></i></div><span class="title" id="title">MyRust UI</span></div>
  <canvas id="canvas" tabindex="0" aria-label="Interactive MyRust UI demo"></canvas>
</div>
<script src="./demo.js?v=3a0c7bf4f3"></script>
</body>
</html>
