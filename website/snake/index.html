<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake · MyRust</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%232f2b26%22/%3E%3C/svg%3E">
<meta name="description" content="Snake built with MyRust: arrows or WASD, one Rust game core.">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    margin: 0;
    overflow: hidden;
    background: #faf8ef;
  }
  .game-frame {
    display: block;
    width: 100%;
    height: 100%;
    height: 100dvh;
    margin: 0;
    padding: 0;
    border: 0;
  }
  .floating-back {
    position: fixed;
    right: 1.25rem;
    bottom: 1.25rem;
    z-index: 50;
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.4375rem 0.8125rem;
    border: 1px solid rgba(143, 122, 102, 0.30);
    border-radius: 9999px;
    background: rgba(250, 248, 239, 0.88);
    box-shadow: 0 2px 8px rgba(119, 110, 101, 0.12);
    color: #776e65;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.8125rem;
    font-weight: 600;
    line-height: 1;
    text-decoration: none;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    user-select: none;
  }
  .floating-back:hover {
    color: #3c3a32;
    background: rgba(255, 255, 255, 0.98);
    transform: translateY(-1px);
  }
  .floating-back svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2.2;
  }
  @media (max-width: 480px) {
    .floating-back { right: 0.75rem; bottom: 0.75rem; }
  }
</style>
</head>
<body>
  <iframe class="game-frame" id="game-frame" src="/docs-demo/?demo=snake" title="Snake built with MyRust" loading="eager"></iframe>
  <a href="/showcase/" class="floating-back" aria-label="Back to showcase">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    <span>Showcase</span>
  </a>
  <script>
    (function () {
      var frame = document.getElementById("game-frame");
      function focusDemo() {
        try {
          var demo = frame.contentWindow;
          if (demo && demo.__demoFocus) demo.__demoFocus();
        } catch (error) {}
      }
      frame.addEventListener("load", function () {
        focusDemo();
        requestAnimationFrame(focusDemo);
      });
      focusDemo();
      [80, 240, 700].forEach(function (delay) {
        setTimeout(focusDemo, delay);
      });
    })();
  </script>
</body>
</html>
