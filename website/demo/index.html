<!doctype html>
<html lang="en">
<head>

<body class="bg-background text-foreground">

  <a href="/" class="flex items-center gap-2 font-semibold tracking-tight">
    <svg viewBox="120 100 160 190" width="20" height="24" aria-hidden="true">
      <path fill="currentColor" d="M200 280 130.72 240 130.72 160 200 120 269.28 160 269.28 240Z"/>
      <g fill="var(--background)">
        <circle cx="165.36" cy="260" r="16"/><circle cx="130.72" cy="200" r="16"/>
        <circle cx="165.36" cy="140" r="16"/><circle cx="234.64" cy="140" r="16"/>
        <circle cx="269.28" cy="200" r="16"/><circle cx="234.64" cy="260" r="16"/>

  <h1 class="text-3xl font-semibold tracking-tight">Showcase</h1>
  <p class="demo-lede mt-3 text-muted-foreground">
    A full landing page drawn by the MyRust native UI engine — hero, feature
    cards, and a live chart — running here through the same widget code as the
    desktop example. Nothing on this canvas is HTML.
  </p>
  <iframe class="demo-frame" src="/docs-demo/?demo=showcase" title="MyRust showcase demo" loading="eager"></iframe>
