[package]
name = "myrust-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop application framework for myrust"

[features]
default = ["a11y", "gpu"]
a11y = [
    "dep:accesskit",
    "dep:accesskit_unix",
    "dep:accesskit_macos",
    "dep:accesskit_windows",
]
gpu = ["dep:wgpu", "myrust-ui/gpu"]
devtools = ["wry/devtools"]
image-decode = ["myrust-ui/image-decode"]

[dependencies]
myrust-ui = { path = "../myrust-ui" }
accesskit = { version = "0.25", optional = true }
ab_glyph.workspace = true
anyhow.workspace = true
arboard.workspace = true
auto-launch.workspace = true
base64.workspace = true
dark-light.workspace = true
dirs.workspace = true
flate2.workspace = true
font8x8.workspace = true
global-hotkey.workspace = true
muda.workspace = true
notify.workspace = true
notify-rust.workspace = true
reqwest.workspace = true
rfd.workspace = true
ring.workspace = true
semver.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_repr.workspace = true
single-instance.workspace = true
softbuffer.workspace = true
souvlaki.workspace = true
sys-locale.workspace = true
tar.workspace = true
tempfile.workspace = true
tao.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tray-icon.workspace = true
wry.workspace = true
wgpu = { workspace = true, optional = true }
zip.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true
accesskit_unix = { version = "0.24", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, features = [
    "NSAccessibility",
    "NSColor",
    "NSColorSpace",
    "NSWorkspace",
] }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { workspace = true, optional = true }
windows = { workspace = true, features = [
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
