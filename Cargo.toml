[workspace]
members = ["myrust-core", "myrust-cli", "examples/dashboard"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
auto-launch = "0.6.0"
axum = "0.8.9"
dark-light = "3.0.0"
dirs = "7.0.0"
flate2 = "1.1.11"
global-hotkey = "0.9.0"
gtk = "0.18.2"
muda = "0.21.2"
notify = "8.2.0"
notify-rust = "4.19.0"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.18.0"
rust-embed = "8.13.0"
semver = "1.0.28"
sha2 = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
single-instance = "0.3.3"
souvlaki = "0.9.3"
sys-locale = "0.3.2"
tar = "0.4.46"
tempfile = "3.27.0"
tao = "0.37.2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.11", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.26.1"
wry = "0.57.1"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
