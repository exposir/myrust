[workspace]
members = ["myrust-core", "myrust-cli", "examples/dashboard"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.8.9"
global-hotkey = "0.9.0"
notify-rust = "4.19.0"
rfd = "0.18.0"
rust-embed = "8.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
single-instance = "0.3.3"
tao = "0.37.2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.11", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.26.1"
wry = "0.57.1"
