<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <style>
      .fill { fill: #2D2E2A; }
      .cut { fill: #FFFFFF; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Cascadia Code", "JetBrains Mono", monospace; fill: #2D2E2A; }
    </style>
  </defs>

  <!--
    几何构造 (φ 比例族)：
    模数 U = 16.67 (框宽 200/12)
    主半径 R = 80 (框宽 × 0.40)
    缝宽 G = 4 (U/4 = 2.5% 框宽)
    齿半径 r = R × 0.20 = 16
    内切半径 Ri = R × 0.618 = 49.44

    构造关系：
    ① 外廓：正六边形，顶点在 R 圆上 (6 个顶点)
    ② 齿孔：6 个圆，圆心在六边形边中点，半径 r
    ③ 内切：六边形顶点在 Ri 圆上
    ④ 中心六芒星：由两个等边三角形嵌套构成

    投影：正面
  -->

  <!-- ========== 齿轮外廓 ========== -->
  <!-- 正六边形 6 顶点 (R=80, 中心 200,200)：
       V0=(200,280) V1=(130.72,240) V2=(130.72,160)
       V3=(200,120) V4=(269.28,160) V5=(269.28,240) -->
  <polygon class="fill" points="200,280 130.72,240 130.72,160 200,120 269.28,160 269.28,240"/>

  <!-- ========== 6 个齿轮齿孔 ========== -->
  <!-- 6 个圆形孔，圆心在各边中点，r=16 -->
  <circle class="cut" cx="165.36" cy="260" r="16"/>
  <circle class="cut" cx="130.72" cy="200" r="16"/>
  <circle class="cut" cx="165.36" cy="140" r="16"/>
  <circle class="cut" cx="234.64" cy="140" r="16"/>
  <circle class="cut" cx="269.28" cy="200" r="16"/>
  <circle class="cut" cx="234.64" cy="260" r="16"/>

  <!-- ========== 内切六边形孔 (Ri = 49.44) ========== -->
  <!-- 顶点在 Ri 圆上：内切六边形削去齿轮内侧 -->
  <polygon class="cut" points="
    200,249.44
    157.16,224.72
    157.16,175.28
    200,150.56
    242.84,175.28
    242.84,224.72
  "/>

  <!-- ========== 中心六芒星 ========== -->
  <!-- 下三角 (顶点在 R×0.30 = 24 的圆上) -->
  <polygon class="cut" points="200,176 224,212 176,212"/>
  <!-- 上三角 -->
  <polygon class="fill" points="200,224 176,188 224,188"/>

  <!-- ========== 中心圆孔 ========== -->
  <circle class="cut" cx="200" cy="200" r="9"/>

  <!-- ========== 文字 "myrust" ========== -->
  <text class="text" x="200" y="365" text-anchor="middle" font-size="48" font-weight="700" letter-spacing="3">myrust</text>

  <!-- 下划线 = 齿轮宽度 -->
  <line class="fill" x1="120" y1="392" x2="280" y2="392" stroke="#2D2E2A" stroke-width="3" stroke-linecap="round"/>
</svg>
